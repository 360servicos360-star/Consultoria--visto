<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Consular VFS - Painel de Gestão e Preparação</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text: #334155;
            --text-light: #64748b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 15px;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            max-width: 700px;
            width: 100%;
        }

        .main-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            margin: 0;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .body-content {
            padding: 30px;
        }

        .nav-tabs {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-light);
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .pane {
            display: none;
        }

        .pane.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary);
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .admin-result {
            margin-top: 20px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .code-box {
            font-family: monospace;
            font-size: 1.25rem;
            font-weight: 700;
            color: #166534;
            background: white;
            padding: 12px;
            border: 2px dashed #4ade80;
            text-align: center;
            margin-top: 10px;
            border-radius: 8px;
        }

        .session-info {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .checklist-box {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 20px;
            margin-top: 15px;
            background: white;
        }

        .check-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .check-item:last-child {
            border-bottom: none;
        }

        .check-item input {
            width: 20px;
            height: 20px;
            margin-right: 14px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bg {
            background: #f1f5f9;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .footer {
            padding: 25px 30px;
            background: #f8fafc;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .developer-tag {
            margin-top: 10px;
            font-weight: 600;
            color: var(--primary);
        }

        .developer-tag a {
            color: #25d366;
            text-decoration: none;
        }
    </style>
</head>

                            <div class="progress-fill" id="barProgresso"></div>
